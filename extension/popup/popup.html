<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoFill AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="logo-icon">AI</div>
        <div class="brand-text">
          <h1>AutoFill AI</h1>
          <span class="version-tag">MV3</span>
        </div>
      </div>
      <button id="btn-open-options-icon" class="icon-btn" title="Open Settings & Profile Editor">
        ⚙️
      </button>
    </header>

    <!-- Main Status Card -->
    <div class="status-card">
      <div class="status-indicator">
        <div id="status-dot" class="dot dot-yellow"></div>
        <span id="status-text">Checking status...</span>
      </div>
      <div class="status-details">
        <div class="status-row">
          <span class="label">Provider:</span>
          <span id="status-provider" class="value">Gemini</span>
        </div>
        <div class="status-row">
          <span class="label">Resume PDF:</span>
          <span id="status-resume" class="value">Not uploaded</span>
        </div>
      </div>
    </div>

    <!-- Primary Action -->
    <button id="btn-fill-page" class="primary-btn">
      <span class="btn-icon">⚡</span>
      <span>Fill This Page</span>
    </button>

    <div class="shortcut-hint">
      Shortcut: <kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>F</kbd>
    </div>

    <!-- Quick Action / Alert if setup needed -->
    <div id="setup-alert" class="setup-alert hidden">
      <p id="setup-alert-msg">Setup needed: Paste your API key & upload your resume.</p>
      <button id="btn-open-setup" class="secondary-btn">Open Profile & API Setup</button>
    </div>

    <!-- Quick PDF Upload Trigger inside popup -->
    <div class="quick-upload-section">
      <label class="quick-upload-label" for="popup-file-input">
        <span>📄 Quick PDF Re-scan</span>
        <input type="file" id="popup-file-input" accept=".pdf" class="hidden-input" />
      </label>
      <div id="quick-upload-status" class="quick-status"></div>
    </div>

    <!-- Footer links -->
    <footer class="popup-footer">
      <button id="btn-open-options" class="link-btn">Full Profile Editor</button>
      <span class="sep">•</span>
      <span class="safe-badge">🔒 100% Local Storage</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
